
name: Crear APK VINYL-O

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto Android
        run: flutter create . --project-name vinyl_o --platforms android

      - name: Instalar dependencias
        run: |
          flutter pub add http shared_preferences
          flutter pub add --dev flutter_launcher_icons

      - name: Copiar código y logo
        run: |
          cp src/main.dart lib/main.dart
          mkdir -p assets
          cp vinyl_o_logo.png assets/vinyl_o_logo.png

      - name: Configurar logo e icono
        run: |
          python3 -c "p='pubspec.yaml'; s=open(p).read(); s=s.replace('  uses-material-design: true', '  uses-material-design: true\n  assets:\n    - assets/vinyl_o_logo.png'); s += '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: assets/vinyl_o_logo.png\n'; open(p,'w').write(s)"
          flutter pub get
          dart run flutter_launcher_icons

      - name: Construir APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VINYL-O-APK
          path: build/app/outputs/flutter-apk/app-release.apk
