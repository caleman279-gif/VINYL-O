
name: Crear APK VINYL-O

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto Android
        run: flutter create . --project-name vinyl_o --platforms android

      - name: Instalar dependencias
        run: flutter pub add http shared_preferences

      - name: Copiar código de VINYL-O
        run: cp src/main.dart lib/main.dart

      - name: Preparar dependencias
        run: flutter pub get

      - name: Construir APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VINYL-O-APK
          path: build/app/outputs/flutter-apk/app-release.apk
