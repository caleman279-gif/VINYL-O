name: Generar firma VINYL-O

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Crear clave permanente
        run: |
          keytool -genkeypair \
            -v \
            -keystore vinyl-o-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -alias vinyl-o \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=VINYL-O, OU=App, O=VINYL-O, L=Arucas, ST=Las Palmas, C=ES"

      - name: Guardar clave
        uses: actions/upload-artifact@v4
        with:
          name: VINYL-O-FIRMA
          path: vinyl-o-release.jks
