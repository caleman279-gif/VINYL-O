name: Crear APK VINYL-O

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto Android
        run: |
          flutter create . --project-name vinyl_o --platforms android
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() => runApp(const VinylO());

          class VinylO extends StatelessWidget {
            const VinylO({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF101010),
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.redAccent,
                  ),
                ),
                home: Scaffold(
                  appBar: AppBar(
                    title: const Text('VINYL-O'),
                    centerTitle: true,
                    backgroundColor: Colors.black,
                  ),
                  body: ListView(
                    padding: const EdgeInsets.all(22),
                    children: [
                      const SizedBox(height: 30),
                      const Text(
                        'YOUR MUSIC. YOUR COLLECTION.',
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          color: Colors.redAccent,
                          letterSpacing: 2,
                          fontSize: 13,
                        ),
                      ),
                      const SizedBox(height: 35),
                      _item(Icons.album, 'MI COLECCIÓN'),
                      _item(Icons.public, 'UNIVERSO MUSICAL'),
                      _item(Icons.favorite_border, 'MI LISTA DE DESEOS'),
                      _item(Icons.bar_chart, 'ESTADÍSTICAS'),
                      _item(Icons.explore, 'DESCUBRIR'),
                    ],
                  ),
                ),
              );
            }
          }

          Widget _item(IconData icon, String title) {
            return Card(
              color: const Color(0xFF202020),
              margin: const EdgeInsets.only(bottom: 14),
              child: ListTile(
                leading: Icon(icon, color: Colors.redAccent, size: 30),
                title: Text(title),
                trailing: const Icon(Icons.chevron_right),
              ),
            );
          }
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VINYL-O-APK
          path: build/app/outputs/flutter-apk/app-release.apk
